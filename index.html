<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 For My Love 💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #fff0f5 0%, #ffe6f0 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      padding: 1rem;
      transition: background 0.6s ease, box-shadow 0.3s;
      margin: 0;
    }

    /* main card */
    .card {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 70px 70px 70px 70px;
      padding: 2.5rem 2rem;
      box-shadow: 0 30px 50px rgba(233, 150, 200, 0.25),
                  0 10px 20px rgba(0, 0, 0, 0.05);
      border: 2px solid rgba(255, 220, 240, 0.5);
      transition: all 0.3s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* cute floating decorations */
    .card::before {
      content: "🌸🌸🌸";
      position: absolute;
      top: -10px;
      left: 0;
      width: 100%;
      font-size: 2.2rem;
      letter-spacing: 15px;
      opacity: 0.2;
      pointer-events: none;
      transform: rotate(-2deg);
    }

    h1, h2, h3 {
      font-weight: 600;
      color: #5a2e4a;
      letter-spacing: -0.3px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .subhead {
      font-size: 1.2rem;
      color: #7f4b6e;
      background: #ffeef6;
      display: inline-block;
      padding: 0.3rem 1.5rem;
      border-radius: 40px;
      margin-bottom: 1.8rem;
      border: 1px solid #ffc1d6;
    }

    .option-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin: 2rem 0 1rem;
    }

    .option-btn {
      background: white;
      border: 3px solid #fbb6d2;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      font-size: 1.6rem;
      font-weight: 600;
      color: #4a2a3a;
      box-shadow: 0 6px 0 #d98aa8;
      cursor: pointer;
      transition: all 0.08s linear;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff9fc;
      flex: 0 1 auto;
    }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d98aa8;
    }

    .option-btn:hover {
      background: #ffecf3;
      border-color: #e07a9e;
    }

    .input-group {
      margin: 2rem 0 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .input-group label {
      font-size: 1.4rem;
      font-weight: 500;
      color: #4a2e40;
      background: #ffe2ef;
      padding: 0.2rem 1.8rem;
      border-radius: 60px;
    }

    .input-group input {
      border: 3px solid #e7b2cb;
      border-radius: 60px;
      padding: 0.9rem 1.8rem;
      font-size: 1.3rem;
      width: 80%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      text-align: center;
      outline: none;
      font-weight: 500;
      color: #2f1d29;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #b47b99;
      box-shadow: 0 0 0 5px #ffd9e9;
      background: white;
    }

    .action-btn {
      background: #f9b5d1;
      border: none;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #2e1d26;
      box-shadow: 0 7px 0 #b96f8f;
      cursor: pointer;
      transition: 0.08s linear;
      border: 2px solid #ffd9ea;
      margin: 0.5rem 0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .action-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #b96f8f;
    }

    .action-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 3px 0 #b96f8f;
      pointer-events: none;
    }

    .yes-no-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
      margin: 25px 0 15px;
    }

    .yes-btn, .no-btn {
      font-size: 2.2rem;
      padding: 0.6rem 2.2rem;
      border-radius: 100px;
      border: 4px solid #f5b3cd;
      background: white;
      font-weight: 700;
      box-shadow: 0 7px 0 #b96f8f;
      transition: all 0.08s linear;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .yes-btn:active, .no-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #b96f8f;
    }

    .yes-btn {
      background: #fbddee;
      color: #3f1f30;
      border-color: #e588b0;
    }

    .no-btn {
      background: #f5e1ea;
      color: #4b2b3b;
      border-color: #dda0b8;
    }

    .password-area {
      margin: 25px 0 15px;
    }

    .password-area input {
      border: 3px solid #d9a3bc;
      border-radius: 60px;
      padding: 0.8rem 1.8rem;
      font-size: 1.3rem;
      width: 70%;
      max-width: 260px;
      background: white;
      text-align: center;
      outline: none;
    }

    .password-area input:focus {
      border-color: #b06f8f;
      box-shadow: 0 0 0 5px #fbcde2;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 30px 0 10px;
    }

    .gallery img {
      width: 100%;
      max-width: 280px;
      height: auto;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 40px;
      border: 6px solid white;
      box-shadow: 0 12px 20px rgba(150, 70, 100, 0.25);
      transition: 0.2s;
      background: #ffd9e9;
    }

    .gallery img:hover {
      transform: scale(1.05) rotate(-2deg);
    }

    .hidden {
      display: none !important;
    }

    .lavender-royal {
      background: linear-gradient(145deg, #b8a2c9 0%, #e6d3f0 45%, #3b3b6b 100%);
      box-shadow: 0 0 30px #8f7bb0, 0 0 60px #2d2b5e;
      border-color: #d7c0e6;
    }

    .lavender-royal .card {
      background: rgba(255, 240, 255, 0.4);
      backdrop-filter: blur(16px);
      border: 3px solid #b7a0d4;
      box-shadow: 0 30px 50px #3f2b5a;
    }

    .lavender-royal h1, .lavender-royal h2, .lavender-royal h3, 
    .lavender-royal label, .lavender-royal .subhead {
      color: #f5eeff;
      text-shadow: 0 3px 8px #1f1430;
    }

    .lavender-royal .option-btn {
      background: #f3eaff;
      border-color: #a78bc7;
      color: #251b32;
    }

    .lavender-royal .action-btn {
      background: #cbb2e6;
      box-shadow: 0 7px 0 #6f5390;
      color: #1e142b;
    }

    .lavender-royal .yes-btn, .lavender-royal .no-btn {
      background: #e3d2f5;
      border-color: #9c7ebf;
      box-shadow: 0 7px 0 #6f5390;
      color: #1a1127;
    }

    .lavender-royal .input-group input {
      background: #f5edff;
      border-color: #ab8fcb;
    }

    /* extra cuteness */
    .doll-emoji {
      font-size: 2.8rem;
      line-height: 1;
      filter: drop-shadow(0 6px 6px rgba(0,0,0,0.1));
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 1rem;
      opacity: 0.7;
      color: #4b3140;
    }

    .bounce-in {
      animation: bounce 0.6s cubic-bezier(0.28, 1.3, 0.7, 1);
    }

    @keyframes bounce {
      0% { transform: scale(0.7); opacity: 0.4; }
      80% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    .bigger-yes {
      transform: scale(1.7);
      margin: 0 0.5rem;
      box-shadow: 0 12px 0 #b96f8f !important;
    }


    /* animated error pages */
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 430px;
      animation: errorPop 0.55s cubic-bezier(.2,1.4,.4,1);
    }

    .error-gif {
      width: 210px;
      height: 210px;
      object-fit: contain;
      border-radius: 35px;
      margin: 10px 0 18px;
      filter: drop-shadow(0 12px 12px rgba(120, 60, 100, 0.18));
      animation: floatGif 2.2s ease-in-out infinite;
    }

    .error-title {
      font-size: 2.4rem;
      color: #8c365e;
      margin-bottom: 10px;
    }

    .error-message {
      font-size: 1.25rem;
      color: #6f4258;
      max-width: 520px;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .error-page .action-btn {
      margin-top: 5px;
    }

    @keyframes errorPop {
      0% { opacity: 0; transform: scale(.7) rotate(-2deg); }
      70% { transform: scale(1.04) rotate(1deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes floatGif {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .error-page.shake-page {
      animation: errorPop 0.55s cubic-bezier(.2,1.4,.4,1), shakePage .45s ease-in-out .2s;
    }

    @keyframes shakePage {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* responsive */
    @media (max-width: 500px) {
      .card { padding: 1.8rem 1.2rem; }
      h1 { font-size: 2rem; }
      .option-btn { font-size: 1.2rem; padding: 0.6rem 1.2rem; }
      .yes-btn, .no-btn { font-size: 1.8rem; padding: 0.4rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <!-- dynamic content will be injected here -->
    <div id="appContainer" class="bounce-in"></div>
    <div class="footer-note">🌸 made with love 🌸</div>
  </div>

  <script>
    (function() {
      const container = document.getElementById('appContainer');

      // ----- state -----
      let currentStep = 'who'; // who | color | love | password | gallery
      let noClickCount = 0;

      // ----- helper render -----
      function render() {
        switch(currentStep) {
          case 'who': renderWho(); break;
          case 'color': renderColor(); break;
          case 'love': renderLove(); break;
          case 'password': renderPassword(); break;
          case 'gallery': renderGallery(); break;
          case 'whoError': renderWhoError(); break;
          case 'colorError': renderColorError(); break;
          default: renderWho();
        }
      }

      // ----- step: who -----
      function renderWho() {
        container.innerHTML = `
          <h1>🍬 Who is this? 🍬</h1>
          <div class="subhead">pick the sweetest name ✨</div>
          <div class="option-grid">
            <div class="option-btn" data-option="banana">🍌 Banana</div>
            <div class="option-btn" data-option="pumpkin">🎃 Pumpkin</div>
            <div class="option-btn" data-option="mango">🥭 Mango</div>
            <div class="option-btn" data-option="strawberry">🍓 Strawberry</div>
          </div>
          <div style="margin-top: 20px; font-size: 2rem;">🧸🧁🎀</div>
        `;
        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const choice = btn.dataset.option;
            if (choice === 'pumpkin') {
              // correct!
              currentStep = 'color';
              render();
            } else {
              // FIRST QUESTION WRONG → dedicated error page
              currentStep = 'whoError';
              render();
            }
          });
        });
      }

      // ----- step: color (favorite color) -----
      function renderColor() {
        container.innerHTML = `
          <h1>🎨 Your favourite color? 🎨</h1>
          <div class="subhead">type it, sweetheart 💜</div>
          <div class="input-group">
            <label for="colorInput">🌸 your color 🌸</label>
            <input type="text" id="colorInput" placeholder="e.g. Red" autocomplete="off">
            <button class="action-btn" id="colorSubmitBtn">💫 submit 💫</button>
          </div>
          <div style="font-size: 2.2rem; margin-top: 0.5rem;">🦄🌈✨</div>
        `;
        const input = document.getElementById('colorInput');
        const submitBtn = document.getElementById('colorSubmitBtn');
        function checkColor() {
          const val = input.value.trim().toLowerCase();
          if (val === 'lavender') {
            // apply lavender + royal blue animation
            document.body.classList.add('lavender-royal');
            // then go to love step
            currentStep = 'love';
            render();
          } else {
            // SECOND QUESTION WRONG → different dedicated error page
            currentStep = 'colorError';
            render();
          }
        }
        submitBtn.addEventListener('click', checkColor);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkColor(); });
        input.focus();
      }

      // ----- error page: first question -----
      function renderWhoError() {
        container.innerHTML = `
          <div class="error-page shake-page">
            <div class="error-title">🚨 OOPSIE! 🚨</div>
            <img
              class="error-gif"
              src="https://media.giphy.com/media/3o6wrvdHFbwBrUFenu/giphy.gif"
              alt="sad cartoon reaction">
            <div class="subhead">Wrong answer, sweetheart 😭</div>
            <div class="error-message">
              That was NOT the sweetest name! 🥺<br>
              I am disappointed...
              but I'll give you another chance. 💕
            </div>
            <button class="action-btn" id="retryWhoBtn">🔄 Try Again</button>
          </div>
        `;

        document.getElementById('retryWhoBtn').addEventListener('click', function() {
          currentStep = 'who';
          render();
        });
      }

      // ----- error page: second question -----
      function renderColorError() {
        container.innerHTML = `
          <div class="error-page">
            <div class="error-title">💔 WRONG COLOR! 💔</div>
            <img
              class="error-gif"
              src="https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif"
              alt="confused cartoon reaction">
            <div class="subhead">Hmm... that's not it 🥺</div>
            <div class="error-message">
              My detective checked the answer... 🔎
              <br><strong>Keep thinking............ </strong>
              <br><br>I'll give you one more chance!
            </div>
            <button class="action-btn" id="retryColorBtn">💜 Try Again</button>
          </div>
        `;

        document.getElementById('retryColorBtn').addEventListener('click', function() {
          currentStep = 'color';
          render();
        });
      }

      // ----- step: love (yes/no) -----
      function renderLove() {
        container.innerHTML = `
          <h1>💕 Do you love Enmon? 💕</h1>
          <div class="subhead">be honest 🥺</div>
          <div class="yes-no-box" id="yesNoBox">
            <button class="yes-btn" id="yesBtn">💖 YES 💖</button>
            <button class="no-btn" id="noBtn">💔 NO</button>
          </div>
          <div style="margin-top: 10px; font-size: 2rem;" id="loveEmojiArea">🧸🐻‍❄️🐇</div>
        `;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const emojiArea = document.getElementById('loveEmojiArea');

        // Initial yes size
        let yesScale = 1;

        noBtn.addEventListener('click', function() {
          noClickCount++;
          // increase yes button size
          yesScale += 0.45;
          yesBtn.style.transform = `scale(${yesScale})`;
          yesBtn.style.boxShadow = `0 ${12 * yesScale}px 0 #b96f8f`;
          yesBtn.style.margin = '0 0.5rem';
          // cute sad doll / emoji
          const sadEmojis = ['😢', '🥺', '💔', '😭', '☹️', '😿'];
          const rand = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
          emojiArea.textContent = `${rand}  ${rand}  ${rand}`;
          // also shake no button a bit
          noBtn.style.animation = 'none';
          setTimeout(() => noBtn.style.animation = 'shake 0.2s', 10);
          // if too many no, add extra dolls
          if (noClickCount > 3) {
            const extraDoll = document.createElement('div');
            extraDoll.textContent = '🧸🧸🧸🧸🧸';
            extraDoll.style.fontSize = '2.2rem';
            container.appendChild(extraDoll);
            setTimeout(() => extraDoll.remove(), 1000);
          }
        });

        yesBtn.addEventListener('click', function() {
          // go to password
          currentStep = 'password';
          render();
        });

        // inject a little style for shake
        const styleShake = document.createElement('style');
        styleShake.textContent = `
          @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
          }
        `;
        document.head.appendChild(styleShake);
      }

      // ----- step: password -----
      function renderPassword() {
        container.innerHTML = `
          <h1>🔐 password please 🔐</h1>
          <div class="subhead">whisper it ...</div>
          <div class="password-area">
            <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="off">
            <br>
            <button class="action-btn" id="passwordSubmitBtn">✨ unlock ✨</button>
          </div>
          <div style="font-size: 2rem; margin-top: 5px;">🔑🐱💖</div>
        `;
        const passInput = document.getElementById('passwordInput');
        const passBtn = document.getElementById('passwordSubmitBtn');
        function checkPass() {
          const val = passInput.value.trim();
          if (val === 'FariDuhh') {
            currentStep = 'gallery';
            render();
          } else {
            passInput.style.borderColor = '#d97a7a';
            passInput.style.background = '#ffe3e3';
            setTimeout(() => {
              passInput.style.borderColor = '';
              passInput.style.background = '';
            }, 500);
            const wrong = document.createElement('div');
            wrong.textContent = '❌ nope, try again (hint: it\'s FariDuhh)';
            wrong.style.color = '#b1557a';
            wrong.style.marginTop = '8px';
            container.appendChild(wrong);
            setTimeout(() => wrong.remove(), 2000);
            passInput.value = '';
          }
        }
        passBtn.addEventListener('click', checkPass);
        passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPass(); });
        passInput.focus();
      }

      // ----- step: gallery (images) -----
      function renderGallery() {
        // Your two images displayed in full size
        const images = [
          'FaridaEnagaged.jpg',
          'cartoon.png'
        ];
        const galleryHTML = images.map(src => `<img src="${src}" alt="cute memory" loading="lazy">`).join('');

        container.innerHTML = `
          <h1>📸 for my love 📸</h1>
          <div class="subhead">our memories 💕</div>
          <div class="gallery">
            ${galleryHTML}
          </div>
          <div style="margin: 30px 0 10px; font-size: 2.5rem; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
            <span>🐻‍❄️</span><span>🌸</span><span>🐇</span><span>💜</span><span>🧸</span>
          </div>
          <button class="action-btn" id="resetBtn" style="background: #dfc2e0;">🔄 start over</button>
        `;
        document.getElementById('resetBtn').addEventListener('click', function() {
          // reset everything
          currentStep = 'who';
          noClickCount = 0;
          document.body.classList.remove('lavender-royal');
          render();
        });
      }

      // initial render
      render();
    })();
  </script>
</body>
</html>
