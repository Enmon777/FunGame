<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 For My Love 💖</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #fff0f5 0%, #ffe6f0 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      padding: 1rem;
      transition: background 0.6s ease, box-shadow 0.3s;
      margin: 0;
    }

    .card {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 70px;
      padding: 2.5rem 2rem;
      box-shadow:
        0 30px 50px rgba(233, 150, 200, 0.25),
        0 10px 20px rgba(0, 0, 0, 0.05);
      border: 2px solid rgba(255, 220, 240, 0.5);
      transition: all 0.3s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "🌸🌸🌸";
      position: absolute;
      top: -10px;
      left: 0;
      width: 100%;
      font-size: 2.2rem;
      letter-spacing: 15px;
      opacity: 0.2;
      pointer-events: none;
      transform: rotate(-2deg);
    }

    h1, h2, h3 {
      font-weight: 600;
      color: #5a2e4a;
      letter-spacing: -0.3px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .subhead {
      font-size: 1.2rem;
      color: #7f4b6e;
      background: #ffeef6;
      display: inline-block;
      padding: 0.3rem 1.5rem;
      border-radius: 40px;
      margin-bottom: 1.8rem;
      border: 1px solid #ffc1d6;
    }

    .option-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin: 2rem 0 1rem;
    }

    .option-btn {
      background: white;
      border: 3px solid #fbb6d2;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      font-size: 1.6rem;
      font-weight: 600;
      color: #4a2a3a;
      box-shadow: 0 6px 0 #d98aa8;
      cursor: pointer;
      transition: all 0.08s linear;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff9fc;
      flex: 0 1 auto;
    }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d98aa8;
    }

    .option-btn:hover {
      background: #ffecf3;
      border-color: #e07a9e;
    }

    .input-group {
      margin: 2rem 0 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .input-group label {
      font-size: 1.4rem;
      font-weight: 500;
      color: #4a2e40;
      background: #ffe2ef;
      padding: 0.2rem 1.8rem;
      border-radius: 60px;
    }

    .input-group input {
      border: 3px solid #e7b2cb;
      border-radius: 60px;
      padding: 0.9rem 1.8rem;
      font-size: 1.3rem;
      width: 80%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      text-align: center;
      outline: none;
      font-weight: 500;
      color: #2f1d29;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #b47b99;
      box-shadow: 0 0 0 5px #ffd9e9;
      background: white;
    }

    .action-btn {
      background: #f9b5d1;
      border: none;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #2e1d26;
      box-shadow: 0 7px 0 #b96f8f;
      cursor: pointer;
      transition: 0.08s linear;
      border: 2px solid #ffd9ea;
      margin: 0.5rem 0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .action-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #b96f8f;
    }

    .yes-no-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
      margin: 25px 0 15px;
    }

    .yes-btn,
    .no-btn {
      font-size: 2.2rem;
      padding: 0.6rem 2.2rem;
      border-radius: 100px;
      border: 4px solid #f5b3cd;
      background: white;
      font-weight: 700;
      box-shadow: 0 7px 0 #b96f8f;
      transition: all 0.08s linear;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .yes-btn:active,
    .no-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #b96f8f;
    }

    .yes-btn {
      background: #fbddee;
      color: #3f1f30;
      border-color: #e588b0;
    }

    .no-btn {
      background: #f5e1ea;
      color: #4b2b3b;
      border-color: #dda0b8;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 30px 0 10px;
    }

    .gallery img {
      width: 100%;
      max-width: 280px;
      height: auto;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 40px;
      border: 6px solid white;
      box-shadow: 0 12px 20px rgba(150, 70, 100, 0.25);
      transition: 0.2s;
      background: #ffd9e9;
    }

    .gallery img:hover {
      transform: scale(1.05) rotate(-2deg);
    }

    .hidden {
      display: none !important;
    }

    .lavender-royal {
      background:
        linear-gradient(
          145deg,
          #b8a2c9 0%,
          #e6d3f0 45%,
          #3b3b6b 100%
        );
      box-shadow:
        0 0 30px #8f7bb0,
        0 0 60px #2d2b5e;
      border-color: #d7c0e6;
    }

    .lavender-royal .card {
      background: rgba(255, 240, 255, 0.4);
      backdrop-filter: blur(16px);
      border: 3px solid #b7a0d4;
      box-shadow: 0 30px 50px #3f2b5a;
    }

    .lavender-royal h1,
    .lavender-royal h2,
    .lavender-royal h3,
    .lavender-royal label,
    .lavender-royal .subhead {
      color: #f5eeff;
      text-shadow: 0 3px 8px #1f1430;
    }

    .lavender-royal .option-btn {
      background: #f3eaff;
      border-color: #a78bc7;
      color: #251b32;
    }

    .lavender-royal .action-btn {
      background: #cbb2e6;
      box-shadow: 0 7px 0 #6f5390;
      color: #1e142b;
    }

    .lavender-royal .yes-btn,
    .lavender-royal .no-btn {
      background: #e3d2f5;
      border-color: #9c7ebf;
      box-shadow: 0 7px 0 #6f5390;
      color: #1a1127;
    }

    .lavender-royal .input-group input {
      background: #f5edff;
      border-color: #ab8fcb;
    }

    .doll-emoji {
      font-size: 2.8rem;
      line-height: 1;
      filter: drop-shadow(0 6px 6px rgba(0,0,0,0.1));
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 1rem;
      opacity: 0.7;
      color: #4b3140;
    }

    .bounce-in {
      animation: bounce 0.6s cubic-bezier(0.28, 1.3, 0.7, 1);
    }

    @keyframes bounce {
      0% {
        transform: scale(0.7);
        opacity: 0.4;
      }

      80% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 430px;
      animation: errorPop 0.55s cubic-bezier(.2,1.4,.4,1);
    }

    .error-gif {
      width: 210px;
      height: 210px;
      object-fit: contain;
      border-radius: 35px;
      margin: 10px 0 18px;
      filter: drop-shadow(0 12px 12px rgba(120, 60, 100, 0.18));
      animation: floatGif 2.2s ease-in-out infinite;
    }

    .error-title {
      font-size: 2.4rem;
      color: #8c365e;
      margin-bottom: 10px;
    }

    .error-message {
      font-size: 1.25rem;
      color: #6f4258;
      max-width: 520px;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    @keyframes errorPop {
      0% {
        opacity: 0;
        transform: scale(.7) rotate(-2deg);
      }

      70% {
        transform: scale(1.04) rotate(1deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes floatGif {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-10px) rotate(2deg);
      }
    }

    .shake-page {
      animation:
        errorPop 0.55s cubic-bezier(.2,1.4,.4,1),
        shakePage .45s ease-in-out .2s;
    }

    @keyframes shakePage {
      0%, 100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(6px);
      }
    }

    /* =========================================================
       PUZZLE
       ========================================================= */

    .puzzle-page {
      position: relative;
      min-height: 430px;
      animation: puzzleAppear 0.6s cubic-bezier(.2,1.3,.4,1);
    }

    @keyframes puzzleAppear {
      from {
        opacity: 0;
        transform: scale(.85) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .puzzle-progress {
      font-size: 1rem;
      color: #8a5874;
      margin: -0.8rem 0 1.2rem;
      font-weight: 600;
    }

    .puzzle-instruction {
      font-size: 1.15rem;
      color: #70445e;
      margin-bottom: 18px;
    }

    .puzzle-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: min(100%, 600px);
      margin: 0 auto 22px;
      padding: 10px;
      background: rgba(255, 235, 245, 0.8);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      box-shadow:
        inset 0 0 20px rgba(180, 100, 140, 0.08),
        0 15px 30px rgba(130, 60, 100, 0.16);
    }

    .puzzle-piece {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 18px;
      border: 4px solid white;
      background: #f9dce9;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 5px 10px rgba(100, 50, 80, 0.15);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .puzzle-piece:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 18px rgba(100, 50, 80, 0.2);
    }

    .puzzle-piece.selected {
      transform: scale(1.05);
      border-color: #ffd34d;
      box-shadow:
        0 0 0 4px rgba(255, 211, 77, 0.35),
        0 10px 25px rgba(210, 150, 30, 0.35);
      z-index: 2;
    }

    .puzzle-piece.correct {
      animation: correctPiece 0.45s ease;
    }

    @keyframes correctPiece {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08) rotate(2deg);
      }

      100% {
        transform: scale(1);
      }
    }

    .puzzle-piece img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .piece-label {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(80, 35, 65, 0.65);
      color: white;
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 0.8rem;
      font-weight: 700;
      backdrop-filter: blur(5px);
    }

    .puzzle-hearts {
      font-size: 1.7rem;
      margin-top: 10px;
      letter-spacing: 5px;
    }

    /* =========================================================
       GOLDEN STAR BLAST
       ========================================================= */

    #starBlast {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
      display: none;
    }

    #starBlast.active {
      display: block;
    }

    .golden-star {
      position: absolute;
      left: 50%;
      top: 50%;
      color: #ffd43b;
      font-size: 25px;
      line-height: 1;
      text-shadow:
        0 0 5px #fff6a0,
        0 0 15px #ffc400,
        0 0 30px #ffb300;
      transform: translate(-50%, -50%) scale(.2);
      animation: starExplode 1.25s cubic-bezier(.1,.7,.2,1) forwards;
    }

    @keyframes starExplode {
      0% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          translate(0, 0)
          rotate(0deg)
          scale(.2);
      }

      15% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          translate(0, 0)
          rotate(20deg)
          scale(1.4);
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          translate(var(--x), var(--y))
          rotate(var(--rotation))
          scale(var(--scale));
      }
    }

    .blast-flash {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 30px 15px #fff5a0,
        0 0 80px 35px #ffd43b,
        0 0 150px 70px rgba(255, 193, 7, 0.45);
      transform: translate(-50%, -50%) scale(0);
      animation: blastFlash 0.75s ease-out forwards;
    }

    @keyframes blastFlash {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
      }

      25% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(4);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(12);
      }
    }

    .completion-message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.5);
      color: #fff8cf;
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 800;
      text-shadow:
        0 3px 0 #9a6500,
        0 0 15px #ffd43b,
        0 0 35px #ffb300;
      white-space: nowrap;
      opacity: 0;
      animation: completionPop 1.3s .2s cubic-bezier(.2,1.5,.4,1) forwards;
    }

    @keyframes completionPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.3) rotate(-8deg);
      }

      35% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1) rotate(2deg);
      }

      70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.15);
      }
    }

    @media (max-width: 500px) {
      .card {
        padding: 1.8rem 1.2rem;
        border-radius: 45px;
      }

      h1 {
        font-size: 2rem;
      }

      .option-btn {
        font-size: 1.2rem;
        padding: 0.6rem 1.2rem;
      }

      .yes-btn,
      .no-btn {
        font-size: 1.8rem;
        padding: 0.4rem 1.5rem;
      }

      .puzzle-board {
        gap: 6px;
        padding: 6px;
        border-radius: 22px;
      }

      .puzzle-piece {
        border-radius: 12px;
        border-width: 3px;
      }

      .piece-label {
        font-size: 0.65rem;
        padding: 2px 6px;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="mainCard">

    <div id="appContainer" class="bounce-in"></div>

    <div class="footer-note">
      🌸 made with love 🌸
    </div>

  </div>

  <!-- Golden star explosion container -->
  <div id="starBlast"></div>


  <script>
    (function() {

      const container = document.getElementById('appContainer');
      const starBlast = document.getElementById('starBlast');

      // =========================================================
      // STATE
      // =========================================================

      let currentStep = 'who';
      let noClickCount = 0;

      // Puzzle state
      let puzzleRound = 0;
      let puzzlePieces = [];
      let selectedPiece = null;

      /*
        Each round uses these 3 image files.

        IMPORTANT:
        The expected order is:
        a → b → c

        So:
        1a.jpg, 1b.jpg, 1c.jpg
        2a.jpg, 2b.jpg, 2c.jpg
        3a.jpg, 3b.jpg, 3c.jpg
      */

      const puzzleRounds = [
        {
          title: "Puzzle 1 💕",
          images: [
            "1a.png",
            "1b.png",
            "1c.png"
          ]
        },
        {
          title: "Puzzle 2 🌸",
          images: [
            "2a.png",
            "2b.png",
            "2c.png"
          ]
        },
        {
          title: "Puzzle 3 ✨",
          images: [
            "3a.png",
            "3b.png",
            "3c.png"
          ]
        }
      ];


      // =========================================================
      // MAIN RENDER
      // =========================================================

      function render() {

        switch(currentStep) {

          case 'who':
            renderWho();
            break;

          case 'color':
            renderColor();
            break;

          case 'love':
            renderLove();
            break;

          case 'puzzle':
            renderPuzzle();
            break;

          case 'gallery':
            renderGallery();
            break;

          case 'whoError':
            renderWhoError();
            break;

          case 'colorError':
            renderColorError();
            break;

          default:
            renderWho();
        }

      }


      // =========================================================
      // WHO
      // =========================================================

      function renderWho() {

        container.innerHTML = `
          <h1>🍬 Who is this? 🍬</h1>

          <div class="subhead">
            pick the sweetest name ✨
          </div>

          <div class="option-grid">

            <div class="option-btn" data-option="banana">
              🍌 Banana
            </div>

            <div class="option-btn" data-option="pumpkin">
              🎃 Pumpkin
            </div>

            <div class="option-btn" data-option="mango">
              🥭 Mango
            </div>

            <div class="option-btn" data-option="strawberry">
              🍓 Strawberry
            </div>

          </div>

          <div style="margin-top:20px;font-size:2rem;">
            🧸🧁🎀
          </div>
        `;


        document.querySelectorAll('.option-btn').forEach(btn => {

          btn.addEventListener('click', () => {

            const choice = btn.dataset.option;

            if (choice === 'pumpkin') {

              currentStep = 'color';
              render();

            } else {

              currentStep = 'whoError';
              render();

            }

          });

        });

      }


      // =========================================================
      // COLOR
      // =========================================================

      function renderColor() {

        container.innerHTML = `
          <h1>🎨 Your favourite color? 🎨</h1>

          <div class="subhead">
            type it, sweetheart 💜
          </div>

          <div class="input-group">

            <label for="colorInput">
              🌸 your color 🌸
            </label>

            <input
              type="text"
              id="colorInput"
              placeholder="e.g. Red"
              autocomplete="off"
            >

            <button class="action-btn" id="colorSubmitBtn">
              💫 submit 💫
            </button>

          </div>

          <div style="font-size:2.2rem;margin-top:.5rem;">
            🦄🌈✨
          </div>
        `;


        const input = document.getElementById('colorInput');
        const submitBtn = document.getElementById('colorSubmitBtn');


        function checkColor() {

          const val = input.value.trim().toLowerCase();

          if (val === 'lavender') {

            document.body.classList.add('lavender-royal');

            currentStep = 'love';
            render();

          } else {

            currentStep = 'colorError';
            render();

          }

        }


        submitBtn.addEventListener('click', checkColor);

        input.addEventListener('keydown', e => {

          if (e.key === 'Enter') {
            checkColor();
          }

        });

        input.focus();

      }


      // =========================================================
      // WHO ERROR
      // =========================================================

      function renderWhoError() {

        container.innerHTML = `
          <div class="error-page shake-page">

            <div class="error-title">
              🚨 OOPSIE! 🚨
            </div>

            <img
              class="error-gif"
              src="https://media.giphy.com/media/3o6wrvdHFbwBrUFenu/giphy.gif"
              alt="sad cartoon reaction"
            >

            <div class="subhead">
              Wrong answer, sweetheart 😭
            </div>

            <div class="error-message">
              That was NOT the sweetest name! 🥺
              <br>
              I am disappointed...
              but I'll give you another chance. 💕
            </div>

            <button class="action-btn" id="retryWhoBtn">
              🔄 Try Again
            </button>

          </div>
        `;


        document.getElementById('retryWhoBtn').addEventListener('click', () => {

          currentStep = 'who';
          render();

        });

      }


      // =========================================================
      // COLOR ERROR
      // =========================================================

      function renderColorError() {

        container.innerHTML = `
          <div class="error-page">

            <div class="error-title">
              💔 WRONG COLOR! 💔
            </div>

            <img
              class="error-gif"
              src="https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif"
              alt="confused cartoon reaction"
            >

            <div class="subhead">
              Hmm... that's not it 🥺
            </div>

            <div class="error-message">
              My detective checked the answer... 🔎
              <br>
              <strong>Keep thinking............</strong>
              <br><br>
              I'll give you one more chance!
            </div>

            <button class="action-btn" id="retryColorBtn">
              💜 Try Again
            </button>

          </div>
        `;


        document.getElementById('retryColorBtn').addEventListener('click', () => {

          currentStep = 'color';
          render();

        });

      }


      // =========================================================
      // LOVE
      // =========================================================

      function renderLove() {

        container.innerHTML = `
          <h1>
            💕 Do you love Me Jaaaan Pakhi? 💕
          </h1>

          <div class="subhead">
            be honest 🥺
          </div>

          <div class="yes-no-box">

            <button class="yes-btn" id="yesBtn">
              💖 YES 💖
            </button>

            <button class="no-btn" id="noBtn">
              💔 NO
            </button>

          </div>

          <div
            style="margin-top:10px;font-size:2rem;"
            id="loveEmojiArea"
          >
            🧸🐻‍❄️🐇
          </div>
        `;


        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const emojiArea = document.getElementById('loveEmojiArea');

        let yesScale = 1;


        noBtn.addEventListener('click', function() {

          noClickCount++;

          yesScale += 0.45;

          yesBtn.style.transform = `scale(${yesScale})`;

          yesBtn.style.boxShadow =
            `0 ${12 * yesScale}px 0 #b96f8f`;

          yesBtn.style.margin = '0 0.5rem';


          const sadEmojis = [
            '😢',
            '🥺',
            '💔',
            '😭',
            '☹️',
            '😿'
          ];

          const rand =
            sadEmojis[Math.floor(Math.random() * sadEmojis.length)];

          emojiArea.textContent =
            `${rand}  ${rand}  ${rand}`;


          noBtn.style.animation = 'none';

          setTimeout(() => {
            noBtn.style.animation = 'shake 0.2s';
          }, 10);


          if (noClickCount > 3) {

            const extraDoll = document.createElement('div');

            extraDoll.textContent =
              '🧸🧸🧸🧸🧸';

            extraDoll.style.fontSize = '2.2rem';

            container.appendChild(extraDoll);

            setTimeout(() => {
              extraDoll.remove();
            }, 1000);

          }

        });


        /*
          IMPORTANT:
          Previously this went directly to gallery.

          Now YES → PUZZLE
        */

        yesBtn.addEventListener('click', function() {

          puzzleRound = 0;
          selectedPiece = null;

          currentStep = 'puzzle';

          render();

        });


        if (!document.getElementById('shakeStyle')) {

          const styleShake = document.createElement('style');

          styleShake.id = 'shakeStyle';

          styleShake.textContent = `
            @keyframes shake {
              0% { transform: translateX(0); }
              25% { transform: translateX(-10px); }
              50% { transform: translateX(10px); }
              75% { transform: translateX(-6px); }
              100% { transform: translateX(0); }
            }
          `;

          document.head.appendChild(styleShake);

        }

      }


      // =========================================================
      // PUZZLE
      // =========================================================

      function renderPuzzle() {

        const round = puzzleRounds[puzzleRound];

        /*
          Create a shuffled version.

          The puzzle always expects:
          a → b → c
        */

        puzzlePieces = round.images.map((src, index) => ({
          src: src,
          correctIndex: index
        }));


        // Shuffle until it isn't already solved
        do {

          puzzlePieces.sort(() => Math.random() - 0.5);

        } while (
          puzzlePieces.every(
            (piece, index) =>
              piece.correctIndex === index
          )
        );


        selectedPiece = null;


        const piecesHTML = puzzlePieces.map((piece, index) => {

          const letter =
            String.fromCharCode(65 + piece.correctIndex);

          return `
            <button
              class="puzzle-piece"
              data-index="${index}"
              aria-label="Puzzle piece ${letter}"
            >

              <img
                src="${piece.src}"
                alt="Puzzle piece ${letter}"
                draggable="false"
              >

              <span class="piece-label">
                ${letter}
              </span>

            </button>
          `;

        }).join('');


        container.innerHTML = `

          <div class="puzzle-page">

            <h1>
              🧩 ${round.title}
            </h1>

            <div class="subhead">
              Put our picture together 💕
            </div>

            <div class="puzzle-progress">
              Puzzle ${puzzleRound + 1} of ${puzzleRounds.length}
            </div>

            <div class="puzzle-instruction">
              ✨ Tap two pieces to swap them ✨
            </div>

            <div class="puzzle-board">
              ${piecesHTML}
            </div>

            <div class="puzzle-hearts">
              💜 🌸 💜 🌸 💜
            </div>

          </div>

        `;


        document.querySelectorAll('.puzzle-piece')
          .forEach(piece => {

            piece.addEventListener('click', () => {

              handlePuzzleClick(
                Number(piece.dataset.index)
              );

            });

          });

      }


      // =========================================================
      // PUZZLE CLICK / SWAP
      // =========================================================

      function handlePuzzleClick(index) {

        const pieces =
          document.querySelectorAll('.puzzle-piece');


        // First piece selected
        if (selectedPiece === null) {

          selectedPiece = index;

          pieces[index].classList.add('selected');

          playTinyClick();

          return;
        }


        // Clicking same piece deselects it
        if (selectedPiece === index) {

          pieces[index].classList.remove('selected');

          selectedPiece = null;

          return;
        }


        // Second piece selected → swap
        const first = selectedPiece;
        const second = index;


        [
          puzzlePieces[first],
          puzzlePieces[second]
        ] = [
          puzzlePieces[second],
          puzzlePieces[first]
        ];


        playTinySwap();


        // Check if solved
        const solved =
          puzzlePieces.every(
            (piece, i) =>
              piece.correctIndex === i
          );


        if (solved) {

          pieces[first].classList.remove('selected');
          pieces[second].classList.remove('selected');

          pieces[first].classList.add('correct');
          pieces[second].classList.add('correct');

          selectedPiece = null;


          setTimeout(() => {

            handlePuzzleSolved();

          }, 500);

          return;
        }


        // Re-render puzzle with new order
        renderPuzzleFromCurrentPieces();

      }


      // =========================================================
      // RE-RENDER AFTER SWAP
      // =========================================================

      function renderPuzzleFromCurrentPieces() {

        const round = puzzleRounds[puzzleRound];

        const piecesHTML = puzzlePieces.map((piece, index) => {

          const letter =
            String.fromCharCode(65 + piece.correctIndex);

          return `
            <button
              class="puzzle-piece"
              data-index="${index}"
              aria-label="Puzzle piece ${letter}"
            >

              <img
                src="${piece.src}"
                alt="Puzzle piece ${letter}"
                draggable="false"
              >

              <span class="piece-label">
                ${letter}
              </span>

            </button>
          `;

        }).join('');


        container.innerHTML = `

          <div class="puzzle-page">

            <h1>
              🧩 ${round.title}
            </h1>

            <div class="subhead">
              Put our picture together 💕
            </div>

            <div class="puzzle-progress">
              Puzzle ${puzzleRound + 1} of ${puzzleRounds.length}
            </div>

            <div class="puzzle-instruction">
              ✨ Tap two pieces to swap them ✨
            </div>

            <div class="puzzle-board">
              ${piecesHTML}
            </div>

            <div class="puzzle-hearts">
              💜 🌸 💜 🌸 💜
            </div>

          </div>

        `;


        document.querySelectorAll('.puzzle-piece')
          .forEach(piece => {

            piece.addEventListener('click', () => {

              handlePuzzleClick(
                Number(piece.dataset.index)
              );

            });

          });

      }


      // =========================================================
      // PUZZLE COMPLETED
      // =========================================================

      function handlePuzzleSolved() {

        /*
          If there are more puzzles,
          move to the next one.
        */

        if (puzzleRound < puzzleRounds.length - 1) {

          puzzleRound++;

          setTimeout(() => {

            renderPuzzle();

          }, 700);

          return;
        }


        /*
          ALL THREE PUZZLES COMPLETED!
        */

        playStarBlastSound();

        createGoldenStarBlast();


        /*
          This is the transition you requested.
        */

        setTimeout(() => {

          currentStep = 'gallery';

          render();

        }, 1500);

      }


      // =========================================================
      // GOLDEN STAR BLAST EFFECT
      // =========================================================

      function createGoldenStarBlast() {

        starBlast.innerHTML = '';

        starBlast.classList.add('active');


        // Bright central flash
        const flash = document.createElement('div');

        flash.className = 'blast-flash';

        starBlast.appendChild(flash);


        // Big completion message
        const message = document.createElement('div');

        message.className = 'completion-message';

        message.textContent = '✨ PERFECT! ✨';

        starBlast.appendChild(message);


        /*
          Create lots of golden stars
          flying outward from the center.
        */

        const starCount = 55;


        for (let i = 0; i < starCount; i++) {

          const star = document.createElement('div');

          star.className = 'golden-star';

          star.textContent =
            Math.random() > 0.35 ? '★' : '✦';


          const angle =
            Math.random() * Math.PI * 2;

          const distance =
            180 + Math.random() * 420;

          const x =
            Math.cos(angle) * distance;

          const y =
            Math.sin(angle) * distance;

          const rotation =
            (Math.random() - 0.5) * 900;

          const scale =
            0.5 + Math.random() * 1.4;


          star.style.setProperty(
            '--x',
            `${x}px`
          );

          star.style.setProperty(
            '--y',
            `${y}px`
          );

          star.style.setProperty(
            '--rotation',
            `${rotation}deg`
          );

          star.style.setProperty(
            '--scale',
            scale
          );


          star.style.animationDelay =
            `${Math.random() * 0.15}s`;


          starBlast.appendChild(star);

        }


        setTimeout(() => {

          starBlast.classList.remove('active');
          starBlast.innerHTML = '';

        }, 1800);

      }


      // =========================================================
      // STAR BLAST SOUND
      // =========================================================

      function playStarBlastSound() {

        /*
          Uses the browser's built-in Web Audio API.
          No sound file is required.
        */

        try {

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContext) return;

          const audio =
            new AudioContext();


          if (audio.state === 'suspended') {
            audio.resume();
          }


          const now = audio.currentTime;


          // Main sparkling tone
          const osc = audio.createOscillator();

          const gain = audio.createGain();


          osc.type = 'sine';

          osc.frequency.setValueAtTime(
            520,
            now
          );

          osc.frequency.exponentialRampToValueAtTime(
            1450,
            now + 0.25
          );


          gain.gain.setValueAtTime(
            0.0001,
            now
          );

          gain.gain.exponentialRampToValueAtTime(
            0.32,
            now + 0.025
          );

          gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.8
          );


          osc.connect(gain);
          gain.connect(audio.destination);

          osc.start(now);
          osc.stop(now + 0.85);


          // Sparkle notes
          const notes = [
            900,
            1200,
            1500,
            1800
          ];


          notes.forEach((frequency, index) => {

            const sparkle =
              audio.createOscillator();

            const sparkleGain =
              audio.createGain();


            const start =
              now + 0.08 + index * 0.09;


            sparkle.type = 'triangle';

            sparkle.frequency.setValueAtTime(
              frequency,
              start
            );


            sparkleGain.gain.setValueAtTime(
              0.0001,
              start
            );

            sparkleGain.gain.exponentialRampToValueAtTime(
              0.14,
              start + 0.015
            );

            sparkleGain.gain.exponentialRampToValueAtTime(
              0.0001,
              start + 0.22
            );


            sparkle.connect(sparkleGain);
            sparkleGain.connect(audio.destination);


            sparkle.start(start);
            sparkle.stop(start + 0.25);

          });


          setTimeout(() => {

            audio.close();

          }, 1500);

        } catch (error) {

          console.log(
            'Star sound could not play:',
            error
          );

        }

      }


      // =========================================================
      // SMALL PUZZLE SOUNDS
      // =========================================================

      function playTinyClick() {

        try {

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContext) return;

          const audio =
            new AudioContext();

          const osc =
            audio.createOscillator();

          const gain =
            audio.createGain();


          osc.type = 'sine';

          osc.frequency.value = 650;


          gain.gain.setValueAtTime(
            0.0001,
            audio.currentTime
          );

          gain.gain.exponentialRampToValueAtTime(
            0.08,
            audio.currentTime + 0.01
          );

          gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audio.currentTime + 0.1
          );


          osc.connect(gain);
          gain.connect(audio.destination);

          osc.start();

          osc.stop(
            audio.currentTime + 0.12
          );

          setTimeout(() => audio.close(), 300);

        } catch (e) {}

      }


      function playTinySwap() {

        try {

          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContext) return;

          const audio =
            new AudioContext();

          const osc =
            audio.createOscillator();

          const gain =
            audio.createGain();


          osc.type = 'triangle';

          osc.frequency.setValueAtTime(
            350,
            audio.currentTime
          );

          osc.frequency.exponentialRampToValueAtTime(
            650,
            audio.currentTime + 0.12
          );


          gain.gain.setValueAtTime(
            0.0001,
            audio.currentTime
          );

          gain.gain.exponentialRampToValueAtTime(
            0.1,
            audio.currentTime + 0.015
          );

          gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audio.currentTime + 0.15
          );


          osc.connect(gain);
          gain.connect(audio.destination);

          osc.start();

          osc.stop(
            audio.currentTime + 0.17
          );

          setTimeout(() => audio.close(), 300);

        } catch (e) {}

      }


      // =========================================================
      // GALLERY
      // =========================================================

      function renderGallery() {

        const images = [
          'FaridaEnagaged.jpg',
          'cartoon.png'
        ];


        const galleryHTML = images
          .map(src => `
            <img
              src="${src}"
              alt="cute memory"
              loading="lazy"

          .join('');


        container.innerHTML = `

          <h1>
            📸 for my love 📸
          </h1>

          <div class="subhead">
            our memories 💕
          </div>

          <div class="gallery">
            ${galleryHTML}
          </div>

          <div
            style="
              margin:30px 0 10px;
              font-size:2.5rem;
              display:flex;
              justify-content:center;
              gap:20px;
              flex-wrap:wrap;
            "
          >
            <span>🐻‍❄️</span>
            <span>🌸</span>
            <span>🐇</span>
            <span>💜</span>
            <span>🧸</span>
          </div>

          <button
            class="action-btn"
            id="resetBtn"
            style="background:#dfc2e0;"
          >
            🔄 start over
          </button>

        `;


        document
          .getElementById('resetBtn')
          .addEventListener('click', function() {

            currentStep = 'who';

            noClickCount = 0;

            puzzleRound = 0;

            selectedPiece = null;

            document.body.classList.remove(
              'lavender-royal'
            );

            render();

          });

      }


      // =========================================================
      // START
      // =========================================================

      render();

    })();
  </script>
